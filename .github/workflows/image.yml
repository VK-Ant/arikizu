name: pi-image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (defaults to tag or 'dev')
        required: false
        default: ""

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: install rust aarch64 target + linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static binfmt-support xz-utils
          rustup target add aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: cross-compile arikizu for aarch64
        run: bash scripts/build-aarch64.sh

      - name: build Pi image
        run: |
          VERSION="${{ inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME}"
          [ -z "$VERSION" ] && VERSION="dev"
          sudo PI_GEN_DIR=/opt/pi-gen bash scripts/build-pi-image.sh "$VERSION"

      - name: compress and checksum
        working-directory: dist
        run: |
          for f in *.zip; do
            unzip -q "$f"
            img=$(basename "$f" .zip).img
            if [ -f "$img" ]; then
              xz -z -9 -e -T 0 "$img"
              sha256sum "$img".xz > "$img".xz.sha256
            fi
          done
          ls -lh

      - name: upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.img.xz
            dist/*.img.xz.sha256

      - name: upload artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: arikizu-pi-image
          path: dist/*.img.xz*
          retention-days: 14
