name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: aarch64-linux
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: aarch64-macos
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: x86_64-macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: install cross tools (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} --bin arikizu

      - name: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          asset="arikizu-${version}-${{ matrix.asset_name }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/arikizu" dist/
          cp README.md dist/
          tar -czf "$asset" -C dist .
          sha256sum "$asset" > "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          echo "ASSET_SHA=$asset.sha256" >> "$GITHUB_ENV"

      - name: upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}

  checksums:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: collect checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir sums && cd sums
          gh release download "${GITHUB_REF_NAME}" -p '*.sha256'
          cat *.sha256 > SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS
