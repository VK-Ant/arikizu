name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"   # weekly, Monday 02:00 UTC

permissions:
  contents: read
  security-events: write    # for CodeQL

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: audit
        run: cargo audit --deny warnings

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: astral-sh/setup-uv@v7
      - name: sync workers
        working-directory: workers
        run: uv sync --all-packages
      - name: install pip-audit
        run: pip install pip-audit
      - name: audit workspace venv
        run: |
          source workers/.venv/bin/activate
          pip-audit --strict --format json > pip-audit.json || true
          cat pip-audit.json
          # Fail only on critical/high; medium/low gets logged but doesn't gate.
          python3 - <<'PY'
          import json, sys
          data = json.load(open("pip-audit.json"))
          vulns = data.get("dependencies", [])
          crit = [v for d in vulns for v in d.get("vulns", []) if v.get("severity", "").lower() in ("critical", "high")]
          if crit:
              print(f"FAIL: {len(crit)} critical/high vulnerabilities")
              for v in crit:
                  print(f"  - {v.get('id')} ({v.get('severity')})")
              sys.exit(1)
          print("ok")
          PY

  codeql-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: rust
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:rust

  codeql-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:python

  sha256sums-check:
    # Verify the pinned model SHA-256s against the download script.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: assert pinned SHA256s in download script
        run: |
          # Fail CI if a model URL is listed with an empty expected sha.
          # (The current script allows "" for ease; CI should tighten.)
          grep -c 'fetch *\\$' scripts/download-default-models.sh || true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
