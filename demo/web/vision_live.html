<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/demo/favicon.png">
  <title>Arikizu Vision Live</title>
  <style>
    :root {
      --bg: #fafaf7; --fg: #1a1a1a; --muted: #6b6b6b; --accent: #c75c2a;
      --card: #ffffff; --border: #e5e5e2; --pass: #2d8a4e; --fail: #b84040;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15150f; --fg: #f0f0ec; --muted: #9b9b96; --accent: #e07a4a;
              --card: #1f1f18; --border: #2a2a22; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg);
                 font-family: var(--sans); font-size: 14px; line-height: 1.5; }
    header { padding: 16px 24px; border-bottom: 1px solid var(--border);
             background: var(--card); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 20px; }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .controls { background: var(--card); border: 1px solid var(--border);
                border-radius: 6px; padding: 14px 18px; margin-bottom: 16px;
                display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input, select {
      font: inherit; background: var(--bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px;
    }
    input[type="text"] { min-width: 240px; }
    button {
      font: inherit; background: var(--accent); color: white; border: none;
      border-radius: 4px; padding: 6px 14px; cursor: pointer;
    }
    button.secondary { background: var(--card); color: var(--fg); border: 1px solid var(--border); }
    button:disabled { opacity: 0.5; cursor: default; }
    .canvas-wrap {
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 10px; display: inline-block; max-width: 100%;
    }
    canvas { display: block; max-width: 100%; height: auto; border-radius: 4px; }
    .meta { color: var(--muted); margin-top: 12px; font-family: var(--mono); font-size: 13px; }
    .detections { margin-top: 16px; }
    .detection {
      display: inline-block; margin: 2px 6px 2px 0; padding: 2px 8px;
      border-radius: 10px; font-family: var(--mono); font-size: 11px;
    }
    .fps { color: var(--muted); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>Arikizu Vision Live</h1>
    <span class="fps">frames: <span id="count">0</span> &nbsp;·&nbsp; fps: <span id="fps">0</span> &nbsp;·&nbsp; status: <span id="status">idle</span></span>
  </header>

  <main>
    <div class="controls">
      <label>image path:</label>
      <input id="path" type="text" value="demo/fixtures/scene.jpg"
             title="Server-side path readable by vision_worker; e.g. /tmp/arikizu-live/latest.jpg">
      <label>serve as:</label>
      <input id="url" type="text" value="/demo/fixtures/scene.jpg"
             title="URL the browser can fetch for the same image">
      <label>conf:</label>
      <input id="conf" type="number" value="0.3" step="0.1" min="0" max="1" style="width: 70px">
      <label>interval ms:</label>
      <input id="interval" type="number" value="1000" min="100" max="10000" style="width: 90px">
      <button id="start">Start (fixture)</button>
      <button id="stop" class="secondary" disabled>Stop</button>
      <button id="once" class="secondary">Snapshot</button>
      <button id="webcam">Use webcam</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas" width="640" height="480"></canvas>
      <video id="video" autoplay playsinline muted hidden style="display:none"></video>
    </div>

    <div class="meta" id="meta">no detections yet</div>
    <div class="detections" id="detections"></div>
  </main>

<script>
"use strict";

const COLORS = [
  "#e74c3c","#3498db","#2ecc71","#f39c12","#9b59b6","#1abc9c",
  "#e67e22","#34495e","#d35400","#16a085","#27ae60","#2980b9",
  "#8e44ad","#c0392b","#f1c40f","#7f8c8d","#2c3e50","#e91e63",
];

let timer = null;
let frameCount = 0;
let lastTickTs = 0;
let fpsEMA = 0;

function setStatus(s) { document.getElementById("status").textContent = s; }

async function tick() {
  const path = document.getElementById("path").value;
  const url  = document.getElementById("url").value;
  const conf = parseFloat(document.getElementById("conf").value);

  try {
    const r = await fetch("/api/v1/call/vision/detect", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ payload: { image_path: path, confidence: conf } }),
    });
    const result = await r.json();

    const img = new Image();
    img.onload = () => {
      const canvas = document.getElementById("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);

      const dets = result.detections || [];
      dets.forEach((d, i) => {
        if (!d.bbox) return;
        const [x1, y1, x2, y2] = d.bbox;
        const color = COLORS[i % COLORS.length];
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
        const label = `${d.class ?? "obj"} ${((d.score ?? 0) * 100).toFixed(0)}%`;
        ctx.font = "bold 14px -apple-system, system-ui, sans-serif";
        const tw = ctx.measureText(label).width + 10;
        ctx.fillStyle = color;
        ctx.fillRect(x1, y1 - 22, tw, 22);
        ctx.fillStyle = "#ffffff";
        ctx.fillText(label, x1 + 5, y1 - 7);
      });

      frameCount++;
      document.getElementById("count").textContent = frameCount;
      const now = performance.now();
      if (lastTickTs > 0) {
        const fps = 1000 / (now - lastTickTs);
        fpsEMA = fpsEMA ? 0.7 * fpsEMA + 0.3 * fps : fps;
        document.getElementById("fps").textContent = fpsEMA.toFixed(1);
      }
      lastTickTs = now;

      // Metadata line
      const backend = result.backend ?? "n/a";
      const model = (result.model ?? "n/a").split("/").pop();
      document.getElementById("meta").textContent =
        `backend: ${backend}   model: ${model}   detections: ${dets.length}` +
        (result.note ? `   note: ${result.note}` : "");

      // Chips
      const chips = dets.map((d, i) => {
        const c = COLORS[i % COLORS.length];
        return `<span class="detection" style="background:${c}22;border:1px solid ${c};color:${c}">${d.class ?? "obj"} ${((d.score ?? 0) * 100).toFixed(0)}%</span>`;
      });
      document.getElementById("detections").innerHTML = chips.join("");

      setStatus("ok");
    };
    img.onerror = () => {
      setStatus("could not load image at " + url);
    };
    img.src = url + "?t=" + Date.now();     // cache-bust
  } catch (e) {
    setStatus("error: " + e.message);
  }
}

document.getElementById("start").onclick = () => {
  if (timer) clearInterval(timer);
  const ms = parseInt(document.getElementById("interval").value, 10);
  tick();
  timer = setInterval(tick, ms);
  document.getElementById("start").disabled = true;
  document.getElementById("stop").disabled = false;
  setStatus("running");
};
document.getElementById("stop").onclick = () => {
  if (timer) clearInterval(timer);
  timer = null;
  document.getElementById("start").disabled = false;
  document.getElementById("stop").disabled = true;
  setStatus("stopped");
};
document.getElementById("once").onclick = tick;

// --- Browser webcam capture ---
// The browser grabs frames from the local webcam (Windows/Mac/Linux) and
// POSTs them as base64 to vision.detect. No OS-level camera passthrough
// needed; the server never touches the device.
let webcamStream = null;
let webcamTimer = null;

async function tickWebcam() {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  if (!video.videoWidth) return;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  // JPEG keeps the payload small
  const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
  const b64 = dataUrl.split(",")[1];

  const conf = parseFloat(document.getElementById("conf").value);
  try {
    const r = await fetch("/api/v1/call/vision/detect", {
      method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({payload: {image_base64: b64, confidence: conf}}),
    });
    const body = await r.json();
    const dets = body.detections || [];
    // Draw boxes over the frame already on canvas
    for (let i = 0; i < dets.length; i++) {
      const d = dets[i];
      const [x1, y1, x2, y2] = d.bbox;
      const c = COLORS[i % COLORS.length];
      ctx.strokeStyle = c;
      ctx.lineWidth = 3;
      ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
      ctx.fillStyle = c;
      ctx.font = "bold 14px sans-serif";
      const label = `${d.class || "obj"} ${((d.score || 0) * 100).toFixed(0)}%`;
      const tw = ctx.measureText(label).width + 8;
      ctx.fillRect(x1, Math.max(0, y1 - 20), tw, 20);
      ctx.fillStyle = "#fff";
      ctx.fillText(label, x1 + 4, Math.max(14, y1 - 6));
    }
    frameCount++;
    document.getElementById("count").textContent = frameCount;
    const now = performance.now();
    if (lastTickTs) {
      const inst = 1000 / (now - lastTickTs);
      fpsEMA = fpsEMA ? fpsEMA * 0.8 + inst * 0.2 : inst;
      document.getElementById("fps").textContent = fpsEMA.toFixed(1);
    }
    lastTickTs = now;
    document.getElementById("meta").textContent =
      `backend: ${body.backend || "?"}  detections: ${dets.length}  (webcam)` +
      (body.note ? "   " + body.note : "");
    const chips = dets.map((d, i) => {
      const c = COLORS[i % COLORS.length];
      return `<span class="detection" style="background:${c}22;border:1px solid ${c};color:${c}">${d.class ?? "obj"} ${((d.score ?? 0) * 100).toFixed(0)}%</span>`;
    });
    document.getElementById("detections").innerHTML = chips.join("");
    setStatus("webcam running");
  } catch (e) {
    setStatus("error: " + e.message);
  }
}

document.getElementById("webcam").onclick = async () => {
  if (webcamStream) {
    // Toggle off
    webcamStream.getTracks().forEach(t => t.stop());
    webcamStream = null;
    if (webcamTimer) clearInterval(webcamTimer);
    webcamTimer = null;
    document.getElementById("webcam").textContent = "Use webcam";
    setStatus("webcam stopped");
    return;
  }
  try {
    setStatus("requesting webcam...");
    webcamStream = await navigator.mediaDevices.getUserMedia({
      video: {width: {ideal: 640}, height: {ideal: 480}},
      audio: false,
    });
    const video = document.getElementById("video");
    video.srcObject = webcamStream;
    await video.play();
    document.getElementById("webcam").textContent = "Stop webcam";
    const ms = Math.max(200, parseInt(document.getElementById("interval").value, 10));
    webcamTimer = setInterval(tickWebcam, ms);
    setStatus("webcam running");
  } catch (e) {
    setStatus("webcam denied or unavailable: " + e.message);
    webcamStream = null;
  }
};
</script>
</body>
</html>
