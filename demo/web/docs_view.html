<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/demo/favicon.png">
<title>Arikizu Docs</title>
<style>
  :root { --bg:#ffffff; --fg:#0a0a0a; --muted:#666666; --accent:#ff6b1a; --card:#ffffff; --border:#e5e5e5;
          --pass:#2d8a4e; --wait:#c89520;
          --sans:-apple-system,system-ui,Roboto,sans-serif; --mono:ui-monospace,Menlo,monospace; }
  @media (prefers-color-scheme: dark) {
    :root{--bg:#0a0a0a;--fg:#ffffff;--muted:#999999;--accent:#ff8a3a;--card:#141414;--border:#2a2a2a;color-scheme:dark;}
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
  .app-header{padding:14px 24px;border-bottom:1px solid var(--border);background:var(--card);display:flex;gap:12px;align-items:center}
  .app-header a.home{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
  .app-header a.home:hover strong{color:var(--accent)}
  .app-header img{width:32px;height:32px;object-fit:contain}
  .app-header strong{font-size:16px;letter-spacing:-0.01em}
  .app-header .sep{color:var(--muted);margin:0 2px}
  .app-header .page{font-size:15px;color:var(--muted)}
  main{padding:24px;max-width:1100px;margin:0 auto}
  .ctl{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input,textarea,button{font:inherit;border-radius:4px}
  input,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--border);padding:5px 8px}
  textarea{font-family:var(--mono);min-height:100px;width:100%;padding:8px}
  button{background:var(--accent);color:#fff;border:none;padding:6px 14px;cursor:pointer}
  .box{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;margin-top:16px}
  .box h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
  .fields{display:grid;grid-template-columns:140px 1fr;gap:6px 16px}
  .fields dt{color:var(--muted);font-family:var(--mono);font-size:12px}
  .fields dd{margin:0;font-family:var(--mono);font-size:13px}
  .tag{display:inline-block;padding:2px 8px;border-radius:3px;font-family:var(--mono);font-size:11px;
       background:color-mix(in srgb,var(--pass) 20%,transparent);color:var(--pass)}
  .tag.wait{background:color-mix(in srgb,var(--wait) 20%,transparent);color:var(--wait)}
</style>
</head>
<body>
<header class="app-header">
  <a href="/demo/" class="home"><img src="/demo/logo.png" alt=""><strong>Arikizu</strong></a>
  <span class="sep">/</span>
  <span class="page">Documents</span>
</header>
<main>
  <div class="box">
    <h3 style="font-size:14px;color:var(--fg);margin:0 0 12px">1. Upload a document</h3>
    <input id="file" type="file" accept=".txt,.md,.log,.json,.csv,.pdf" style="color:var(--muted);font-size:13px">
    <div id="file-status" style="margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--muted)">no file selected (will use demo/fixtures/sample.txt)</div>
    <input id="path" type="hidden" value="demo/fixtures/sample.txt">
  </div>
  <div class="box">
    <h3 style="font-size:14px;color:var(--fg);margin:0 0 12px">2. Ask a question about the document</h3>
    <input id="question" placeholder="e.g. what is the invoice number? what is the due date?" style="font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:8px 10px;width:70%">
    <button id="ask" style="font-size:14px;padding:8px 20px">Ask</button>
    <div id="answer" style="margin-top:14px;font-family:var(--sans);font-size:14px;color:var(--muted);min-height:40px"></div>
  </div>
  <details style="margin-top:16px">
    <summary style="color:var(--muted);cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.08em">Advanced: schema-based extract (for structured docs)</summary>
    <div style="margin-top:12px">
      <button id="extract">Extract fields with schema</button>
    </div>
  </details>
  <div class="box">
    <h3>Schema (JSON)</h3>
    <textarea id="schema">{
  "date": "string",
  "shift": "string",
  "line": "integer",
  "defects": "array"
}</textarea>
  </div>
  <div class="box">
    <h3>Extracted fields</h3>
    <div id="status"><span class="tag wait">WAIT</span> not run yet</div>
    <dl class="fields" id="fields"></dl>
  </div>
  <div class="box">
    <h3>Search (docs.search)</h3>
    <input id="q" value="defect" placeholder="query" style="min-width:200px">
    <input id="k" type="number" value="3" style="width:60px">
    <button id="go-search" style="margin-left:8px">Go</button>
    <div id="hits" style="margin-top:10px"></div>
  </div>
</main>
<script>
"use strict";
async function call(cap, payload) {
  const [d, op] = cap.split(".");
  const r = await fetch(`/api/v1/call/${d}/${op}`, {
    method: "POST", headers: {"content-type":"application/json"},
    body: JSON.stringify({payload})
  });
  return r.json();
}
// pdf.js is lazy-loaded on first PDF upload so plain text users don't
// pay for the ~2MB script.
let _pdfjsReady = null;
function ensurePdfJs() {
  if (_pdfjsReady) return _pdfjsReady;
  _pdfjsReady = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => {
      window["pdfjsLib"].GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      res(window["pdfjsLib"]);
    };
    s.onerror = () => rej(new Error("could not load pdf.js"));
    document.head.appendChild(s);
  });
  return _pdfjsReady;
}
async function readPdfText(file) {
  const pdfjs = await ensurePdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjs.getDocument({data: buf}).promise;
  const texts = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    texts.push(content.items.map(x => x.str).join(" "));
  }
  return texts.join("\n");
}
document.getElementById("file").addEventListener("change", () => {
  const f = document.getElementById("file").files[0];
  const s = document.getElementById("file-status");
  if (f) s.textContent = "selected: " + f.name + " (" + Math.round(f.size/1024) + " KB)";
  else s.textContent = "no file selected (will use demo/fixtures/sample.txt)";
});
async function readUpload() {
  const fileEl = document.getElementById("file");
  const f = fileEl && fileEl.files && fileEl.files[0];
  if (!f) return null;
  const name = f.name.toLowerCase();
  if (name.endsWith(".pdf")) {
    const text = await readPdfText(f);
    return {name: f.name, text};
  }
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res({name: f.name, text: r.result});
    r.onerror = () => rej(r.error);
    r.readAsText(f);
  });
}
document.getElementById("extract").onclick = async () => {
  const path = document.getElementById("path").value;
  let schema = {};
  try { schema = JSON.parse(document.getElementById("schema").value); }
  catch(e) { alert("schema invalid: " + e.message); return; }
  const uploaded = await readUpload();
  const payload = {file_path: path, schema};
  if (uploaded) { payload.file_text = uploaded.text; payload.file_path = uploaded.name; }
  const b = await call("docs.extract", payload);
  const stat = document.getElementById("status");
  const fieldsCount = Object.values(b.fields || {}).filter(v => v !== null && v !== undefined && !(Array.isArray(v) && v.length === 0)).length;
  if (b.note) {
    stat.innerHTML = `<span class="tag wait">WAIT</span> ${b.note}`;
  } else if (fieldsCount > 0) {
    stat.innerHTML = `<span class="tag">PASS</span> extracted ${fieldsCount} field(s) from ${b.chars_scanned || 0} chars (${b.backend || "demo"})`;
  } else {
    stat.innerHTML = `<span class="tag wait">EMPTY</span> no fields matched; check schema or try the fixture</span>`;
  }
  const dl = document.getElementById("fields");
  dl.innerHTML = "";
  const fields = b.fields || {};
  for (const [k, v] of Object.entries(fields)) {
    dl.innerHTML += `<dt>${k}</dt><dd>${typeof v === "object" ? JSON.stringify(v) : v}</dd>`;
  }
  if (!Object.keys(fields).length) dl.innerHTML = `<dt style="color:var(--muted)">no fields</dt><dd></dd>`;
};
document.getElementById("go-search").onclick = async () => {
  const q = document.getElementById("q").value;
  const k = parseInt(document.getElementById("k").value, 10);
  const b = await call("docs.search", {query: q, top_k: k});
  const el = document.getElementById("hits");
  const hits = b.hits || [];
  if (b.note && /placeholder/i.test(b.note)) {
    el.innerHTML = `<span class="tag wait">WAIT</span> ${b.note}`;
  } else {
    el.innerHTML = hits.length === 0
      ? `<span style="color:var(--muted)">no results</span>`
      : hits.map(h => `<div style="font-family:var(--mono);font-size:12px;padding:4px 0">${JSON.stringify(h)}</div>`).join("");
  }
};

// Ask question over document (SLM-based QA)
document.getElementById("ask").onclick = async () => {
  const q = document.getElementById("question").value.trim();
  const out = document.getElementById("answer");
  if (!q) { out.textContent = "please type a question"; return; }
  const uploaded = await readUpload();
  const path = document.getElementById("path").value;
  let text = "";
  if (uploaded) text = uploaded.text;
  if (!text && path) {
    // Fetch the server-side file through the search endpoint fallback
    text = "(server will read: " + path + ")";
  }
  out.textContent = "thinking...";
  const prompt = (text && !text.startsWith("(")) ?
    `Answer the question using only this document.\n\nDocument:\n${text.slice(0, 4000)}\n\nQuestion: ${q}\nAnswer:` :
    `Answer using what the Arikizu docs say: ${q}`;
  try {
    const r = await fetch("/api/v1/call/reasoning/answer", {
      method: "POST",
      headers: {"content-type":"application/json"},
      body: JSON.stringify({payload: {question: prompt, context: "", max_tokens: 300}}),
    });
    const b = await r.json();
    out.innerHTML = `<div style="color:var(--fg)">${(b.answer || "(no answer)").replace(/\n/g,"<br>")}</div>` +
      `<div style="margin-top:6px">backend: ${b.backend || "?"}</div>`;
  } catch (e) {
    out.textContent = "error: " + e.message;
  }
};
</script>
</body>
</html>
