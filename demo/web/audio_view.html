<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/demo/favicon.png">
  <title>Arikizu Audio</title>
  <style>
    :root { --bg:#ffffff; --fg:#0a0a0a; --muted:#666666; --accent:#ff6b1a; --card:#ffffff;
            --border:#e5e5e5; --pass:#2d8a4e; --wait:#c89520;
            --mono: ui-monospace, Menlo, Consolas, monospace;
            --sans: -apple-system, system-ui, Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0a0a0a; --fg:#ffffff; --muted:#999999; --accent:#ff8a3a; --card:#141414; --border:#2a2a2a; color-scheme: dark; }
    }
    *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
    .app-header { padding:14px 24px; border-bottom:1px solid var(--border); background:var(--card); display:flex; gap:12px; align-items:center; }
    .app-header a.home { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
    .app-header a.home:hover strong { color:var(--accent); }
    .app-header img { width:32px; height:32px; object-fit:contain; }
    .app-header strong { font-size:16px; letter-spacing:-0.01em; }
    .app-header .sep { color:var(--muted); margin:0 2px; }
    .app-header .page { font-size:15px; color:var(--muted); }
    main { padding:24px; max-width:1100px; margin:0 auto; }
    .ctl { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:12px 18px;
           display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    input, button { font:inherit; border-radius:4px; }
    input[type="text"], input[type="file"] { background:var(--bg); color:var(--fg); border:1px solid var(--border); padding:5px 8px; min-width:240px; }
    button { background:var(--accent); color:#fff; border:none; padding:6px 14px; cursor:pointer; }
    button.sec { background:var(--card); color:var(--fg); border:1px solid var(--border); }
    .viz { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:16px; margin-top:16px; }
    canvas { display:block; width:100%; height:140px; background: var(--bg); border-radius: 4px; }
    .meta { color:var(--muted); font-family:var(--mono); font-size:12px; margin-top:10px; }
    .seg { position:absolute; top:0; bottom:0; background: color-mix(in srgb, var(--pass) 25%, transparent); border-left: 1px solid var(--pass); border-right: 1px solid var(--pass); }
    .seg-wrap { position:relative; margin-top: 8px; }
    .transcript { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:16px; margin-top:16px; }
    .transcript h3 { margin:0 0 8px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
    .tag { display:inline-block; padding:2px 8px; border-radius:3px; font-family:var(--mono); font-size:11px;
           background: color-mix(in srgb, var(--pass) 20%, transparent); color: var(--pass); }
    .tag.wait { background: color-mix(in srgb, var(--wait) 20%, transparent); color: var(--wait); }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="/demo/" class="home"><img src="/demo/logo.png" alt=""><strong>Arikizu</strong></a>
    <span class="sep">/</span>
    <span class="page">Audio</span>
  </header>
  <main>
    <div id="model-banner" style="padding:12px 16px; margin-bottom:16px; border-radius:6px; border:1px solid var(--border); background:var(--card); font-family:var(--mono); font-size:13px;">
      <span id="model-dot" style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#999; margin-right:8px; vertical-align:middle;"></span>
      <span id="model-text">checking audio stack...</span>
      <span id="model-hint" style="color:var(--muted); margin-left:12px;"></span>
    </div>

    <div class="ctl">
      <button id="mic">Use microphone</button>
      <span id="mic-indicator" style="margin-left:8px;padding:4px 10px;border-radius:4px;background:var(--card);border:1px solid var(--border);font-family:var(--mono);font-size:12px;color:var(--muted)">mic: idle</span>
      <span style="color:var(--muted);font-size:12px;margin-left:16px">speak a keyword from the list; the indicator flips to KW: &lt;word&gt; on match</span>
    </div>
    <div class="ctl" style="margin-top:12px">
      <label>keywords (comma):</label>
      <input id="keywords" type="text" value="help, stop, alice" placeholder="e.g. help, stop, alice" style="min-width:260px">
      <span id="asr-status" style="color:var(--muted);font-size:12px">keyword matching: using browser speech recognition when mic is on</span>
    </div>
    <div class="ctl" style="margin-top:12px">
      <strong>Live transcript</strong>
      <span id="live-transcript" style="color:var(--muted);font-style:italic;min-width:300px">(speak once the mic is on)</span>
    </div>

    <div class="viz">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong>Waveform</strong>
        <span class="meta" id="wave-meta">mic off</span>
      </div>
      <canvas id="wave"></canvas>
      <div class="seg-wrap" id="segs" style="height: 24px"></div>
    </div>
  </main>

<script>
"use strict";

// --- Real-time browser microphone ---
// Grabs raw PCM from the mic, draws a live waveform, and every ~1 s
// posts a chunk as a JSON PCM array to audio.vad. Server returns
// whether speech was detected; indicator pulses green when it is.
let micCtx = null, micStream = null, micProcessor = null, micSrc = null;
let micBuf = [];
let micSampleRate = 16000;
let micChunkTimer = null;

let _kwHoldUntil = 0;
function setMicIndicator(txt, color) {
  const el = document.getElementById("mic-indicator");
  if (!el) return;
  // A KW hit sticks for 2.5s so a one-word keyword stays visible.
  const now = Date.now();
  if (txt.startsWith("KW:")) {
    _kwHoldUntil = now + 2500;
  } else if (now < _kwHoldUntil) {
    return;  // still inside the sticky window; don't overwrite
  }
  el.textContent = "mic: " + txt;
  el.style.color = color || "var(--muted)";
}

async function startMic() {
  try {
    setMicIndicator("requesting permission...");
    micStream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, sampleRate: 16000}, video: false});
    micCtx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 16000});
    micSampleRate = micCtx.sampleRate;
    micSrc = micCtx.createMediaStreamSource(micStream);
    // ScriptProcessor is deprecated but still the simplest way to get raw PCM
    micProcessor = micCtx.createScriptProcessor(2048, 1, 1);
    micSrc.connect(micProcessor);
    micProcessor.connect(micCtx.destination);
    micBuf = [];
    micProcessor.onaudioprocess = (e) => {
      const data = e.inputBuffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) micBuf.push(data[i]);
      // Live waveform render reusing the existing canvas
      const canvas = document.getElementById("wave");
      if (canvas) {
        const ctx = canvas.getContext("2d");
        const w = canvas.width = canvas.clientWidth;
        const h = canvas.height = 140;
        ctx.fillStyle = getComputedStyle(canvas).backgroundColor || "#000";
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent") || "#ff6b1a";
        ctx.lineWidth = 1;
        ctx.beginPath();
        const step = Math.max(1, Math.floor(data.length / w));
        for (let x = 0; x < w; x++) {
          const v = data[x * step] || 0;
          const y = h/2 - v * h/2;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    };
    // Every 1 second, send a chunk to the server for VAD (audit log only).
    // The indicator is driven by the browser recognizer (startRecognizer),
    // which does real phonetic matching. The PCM chunker here just keeps
    // the server-side VAD call warm so the operator dashboard shows
    // activity; it does NOT touch the indicator, which would overwrite
    // the recognizer's "KW: help" with "silence".
    micChunkTimer = setInterval(async () => {
      if (micBuf.length < micSampleRate) return;  // need 1s of data
      const chunk = micBuf.slice(0, micSampleRate);
      micBuf = micBuf.slice(micSampleRate);
      // Only fire the server call when the recognizer is NOT running — the
      // recognizer owns the mic in Chrome/Edge, so this VAD call is a
      // fallback for Firefox or anywhere Web Speech API is missing.
      if (recognizer) return;
      try {
        const r = await fetch("/api/v1/call/audio/vad", {
          method: "POST", headers: {"content-type":"application/json"},
          body: JSON.stringify({payload: {pcm: Array.from(chunk), sample_rate: micSampleRate, threshold: 0.3}}),
        });
        const b = await r.json();
        if (b.speech_detected || (b.segments && b.segments.length > 0)) {
          setMicIndicator("SPEECH", "var(--pass)");
        } else {
          setMicIndicator("silence", "var(--muted)");
        }
      } catch (e) {
        setMicIndicator("error: " + e.message, "var(--fail)");
      }
    }, 1000);
    setMicIndicator("listening", "var(--pass)");
    document.getElementById("mic").textContent = "Stop microphone";
  } catch (e) {
    setMicIndicator("denied: " + e.message, "var(--fail)");
  }
}

function stopMic() {
  if (micChunkTimer) { clearInterval(micChunkTimer); micChunkTimer = null; }
  if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
  if (micSrc) { micSrc.disconnect(); micSrc = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micCtx) { micCtx.close(); micCtx = null; }
  micBuf = [];
  setMicIndicator("idle");
  document.getElementById("mic").textContent = "Use microphone";
}

document.getElementById("mic").onclick = () => {
  if (micStream) stopMic(); else startMic();
};

// --- Model status banner on page load ---
async function checkAudio() {
  try {
    const r = await fetch("/api/v1/call/audio/backends", {
      method: "POST", headers: {"content-type":"application/json"},
      body: JSON.stringify({payload: {}}),
    });
    const b = await r.json();
    const dot  = document.getElementById("model-dot");
    const text = document.getElementById("model-text");
    const hint = document.getElementById("model-hint");
    if (b.vad_loaded) {
      dot.style.background = "var(--pass)";
      text.textContent = `VAD loaded: ${(b.vad_path||"").split("/").pop()}`;
      hint.textContent = "voice-activity detection ready";
    } else {
      dot.style.background = "var(--fail)";
      text.textContent = "no VAD model loaded";
      hint.innerHTML = 'fix: run <code style="background:var(--bg);padding:1px 6px;border-radius:3px">scripts/download-default-models.sh</code>';
    }
  } catch (e) {
    document.getElementById("model-dot").style.background = "var(--fail)";
    document.getElementById("model-text").textContent = "runtime unreachable";
    document.getElementById("model-hint").textContent = "start the supervisor: make run";
  }
}
checkAudio();

// --- Real keyword matching via browser Web Speech API ---
// VAD alone cannot tell "I need help" from "nice to meet you". Chrome and
// Edge ship a free, offline-capable speech recognizer; we use it to do real
// phonetic matching for the keyword list. Server VAD still runs in parallel
// for the speech/silence indicator and audit log.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;

function startRecognizer() {
  if (!SR) {
    document.getElementById("asr-status").textContent =
      "keyword matching: this browser has no SpeechRecognition; try Chrome or Edge";
    document.getElementById("asr-status").style.color = "var(--wait)";
    return;
  }
  try {
    recognizer = new SR();
    recognizer.continuous = true;
    recognizer.interimResults = true;
    recognizer.lang = "en-US";
    recognizer.onresult = (event) => {
      let interim = "", finalTxt = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalTxt += t; else interim += t;
      }
      const shown = (finalTxt + " " + interim).trim();
      if (shown) {
        document.getElementById("live-transcript").textContent = shown;
        document.getElementById("live-transcript").style.fontStyle = "normal";
        document.getElementById("live-transcript").style.color = "var(--fg)";
      }
      // Check keywords against latest utterance (local, instant)
      const kwRaw = (document.getElementById("keywords") || {}).value || "";
      const keywords = kwRaw.split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
      const haystack = shown.toLowerCase();
      const localHits = keywords.filter(k => haystack.includes(k));
      if (localHits.length) {
        setMicIndicator("KW: " + localHits.join(", "), "var(--pass)");
      } else if (shown) {
        // Speech happened but didn't match a keyword. Show that we heard
        // something so the user doesn't think the mic is dead.
        setMicIndicator("heard: " + shown.slice(-30), "var(--fg)");
      }
      // Also post FINAL transcripts to the server so hits land in the
      // audit log and the operator dashboard sees them.
      if (finalTxt.trim() && keywords.length) {
        fetch("/api/v1/call/audio/keyword_spot", {
          method: "POST", headers: {"content-type":"application/json"},
          body: JSON.stringify({payload: {transcript: finalTxt, keywords}}),
        }).catch(() => {});
      }
    };
    recognizer.onerror = (e) => {
      // "no-speech" fires routinely; ignore it
      if (e.error === "no-speech" || e.error === "aborted") return;
      document.getElementById("asr-status").textContent =
        "keyword matching: speech recognition error (" + e.error + ")";
    };
    recognizer.onend = () => {
      // Auto-restart while mic is on
      if (micStream && recognizer) {
        try { recognizer.start(); } catch (e) { /* already starting */ }
      }
    };
    recognizer.start();
    setMicIndicator("listening", "var(--pass)");
    document.getElementById("asr-status").textContent =
      "keyword matching: browser speech recognition active";
    document.getElementById("asr-status").style.color = "var(--pass)";
  } catch (e) {
    document.getElementById("asr-status").textContent =
      "keyword matching: could not start recognizer: " + e.message;
  }
}

function stopRecognizer() {
  if (recognizer) {
    try { recognizer.onend = null; recognizer.stop(); } catch (e) {}
    recognizer = null;
  }
  document.getElementById("asr-status").textContent =
    "keyword matching: using browser speech recognition when mic is on";
  document.getElementById("asr-status").style.color = "var(--muted)";
  document.getElementById("live-transcript").textContent = "(speak once the mic is on)";
  document.getElementById("live-transcript").style.fontStyle = "italic";
  document.getElementById("live-transcript").style.color = "var(--muted)";
}

// Replace mic click so starting/stopping the mic also toggles the recognizer.
// The server-side VAD chunker still runs in parallel; this is additive.
document.getElementById("mic").onclick = async () => {
  if (micStream) {
    stopRecognizer();
    stopMic();
  } else {
    await startMic();
    if (micStream) startRecognizer();
  }
};
</script>
</body>
</html>
