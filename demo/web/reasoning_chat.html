<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/demo/favicon.png">
  <title>Arikizu Reasoning</title>
  <style>
    .backend-banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; line-height: 1.5; font-family: ui-monospace, Menlo, monospace; }
    .backend-banner.ok { background: color-mix(in srgb, var(--pass) 15%, transparent); color: var(--pass); border: 1px solid color-mix(in srgb, var(--pass) 40%, transparent); }
    .backend-banner.warn { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
    :root { --bg:#fafaf7; --fg:#1a1a1a; --muted:#6b6b6b; --accent:#c75c2a; --card:#fff;
            --border:#e5e5e2; --pass:#2d8a4e; --fail:#b84040;
            --sans: -apple-system, system-ui, Roboto, sans-serif;
            --mono: ui-monospace, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#15150f; --fg:#f0f0ec; --muted:#9b9b96; --accent:#e07a4a; --card:#1f1f18; --border:#2a2a22; color-scheme: dark; }
    }
    *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;height:100%}
    header { padding:16px 24px; border-bottom:1px solid var(--border); background:var(--card); }
    main { padding:24px; max-width:800px; margin:0 auto; display:flex; flex-direction:column; height: calc(100vh - 80px); }
    .chat {
      background:var(--card); border:1px solid var(--border); border-radius:8px;
      flex:1; overflow-y:auto; padding:16px; margin-bottom:12px;
    }
    .msg { margin-bottom:14px; }
    .msg.user { text-align: right; }
    .msg .bubble {
      display:inline-block; max-width:85%; padding:10px 14px; border-radius:12px;
      text-align:left; font-size:14px; line-height:1.5;
    }
    .msg.user .bubble { background: var(--accent); color: #fff; border-top-right-radius: 2px; }
    .msg.assistant .bubble { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-top-left-radius: 2px; }
    .msg .meta { font-size:11px; color:var(--muted); margin-top:4px; font-family:var(--mono); }
    .input-row {
      display: flex; gap: 8px; align-items: flex-end;
    }
    .input-row textarea {
      flex: 1; font: inherit; background: var(--card); color: var(--fg); border: 1px solid var(--border);
      border-radius: 4px; padding: 10px; resize: vertical; min-height: 60px; max-height: 200px;
      font-family: var(--mono); font-size: 13px;
    }
    button { font:inherit; background:var(--accent); color:#fff; border:none; border-radius:4px;
             padding:10px 20px; cursor:pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .mode { display:flex; gap:6px; align-items:center; margin-bottom:8px; font-size: 13px; color: var(--muted); }
    .mode select { font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--border);
                   border-radius: 4px; padding: 4px 8px; }
    .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 13px; }
    .thinking { display: inline-block; }
    .thinking::after { content: "..."; animation: dots 1s steps(4, end) infinite; }
    @keyframes dots {
      0%, 20% { content: ""; }
      40% { content: "."; }
      60% { content: ".."; }
      80%, 100% { content: "..."; }
    }
  </style>
</head>
<body>
  <header>
    <h1 style="margin:0;font-size:20px">Arikizu Reasoning</h1>
    <div style="color:var(--muted); font-size:13px; margin-top:4px;">
      Local LLM via GGUF file, HTTP endpoint, or built-in knowledge base. Backend is picked automatically.
    </div>
  </header>
  <main>
    <div id="backend-banner" class="backend-banner" hidden></div>
    <div class="mode">
      Mode:
      <select id="mode">
        <option value="answer">answer (Q &amp; A with context)</option>
        <option value="summarize">summarize (text in, summary out)</option>
        <option value="complete">complete (freeform)</option>
      </select>
      <label style="margin-left:12px">max tokens:</label>
      <input type="number" id="max" value="200" min="20" max="1000" style="width:70px; font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px;">
      <button style="margin-left:auto; background: var(--card); color: var(--fg); border: 1px solid var(--border); padding: 4px 12px; font-size: 12px;" onclick="document.getElementById('chat').innerHTML=''">Clear</button>
    </div>

    <div class="chat" id="chat">
      <div class="empty">Type a question or paste text to summarize.</div>
    </div>
    <div class="input-row">
      <textarea id="input" placeholder="Type here, Shift+Enter for newline, Enter to send"></textarea>
      <button id="send">Send</button>
    </div>
  </main>

<script>
"use strict";

function msg(role, text, meta) {
  const chat = document.getElementById("chat");
  chat.querySelector(".empty")?.remove();
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  div.appendChild(bubble);
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta;
    div.appendChild(m);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

async function send() {
  const inputEl = document.getElementById("input");
  const text = inputEl.value.trim();
  if (!text) return;
  const mode = document.getElementById("mode").value;
  const maxTokens = parseInt(document.getElementById("max").value, 10);
  const btn = document.getElementById("send");

  msg("user", text);
  inputEl.value = "";
  btn.disabled = true;
  const thinking = msg("assistant", "", "thinking...");
  thinking.innerHTML = '<span class="thinking">thinking</span>';

  const t0 = performance.now();
  let payload = {};
  let path = `/api/v1/call/reasoning/${mode}`;
  if (mode === "answer") {
    payload = { question: text, context: "", max_tokens: maxTokens };
  } else if (mode === "summarize") {
    payload = { text, template: "", max_tokens: maxTokens };
  } else {
    payload = { prompt: text, max_tokens: maxTokens };
  }

  try {
    const r = await fetch(path, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ payload }),
    });
    const ms = Math.round(performance.now() - t0);
    const body = await r.json();
    const content = body.answer || body.summary || body.completion || body.error || "(empty)";
    thinking.textContent = content;
    thinking.parentElement.querySelector(".meta").textContent =
      `${mode} · ${body.model || ""} · backend=${body.backend || "?"} · ${ms} ms` + (body.error ? ` · ${body.error}` : "");
    // Prominent banner so the user knows what is actually answering.
    const b = (body.backend || "").toLowerCase();
    const banner = document.getElementById("backend-banner");
    if (banner) {
      if (b === "local-gguf") {
        banner.textContent = "running local LLM via llama-cpp (" + (body.model || "") + ")";
        banner.className = "backend-banner ok";
      } else if (b === "http") {
        banner.textContent = "using remote LLM endpoint";
        banner.className = "backend-banner ok";
      } else {
        banner.textContent = "built-in mode (no LLM loaded). To get real answers: scripts/download-default-models.sh --tier minimum, then set ARIKIZU_REASONING_GGUF in arikizu.yaml.";
        banner.className = "backend-banner warn";
      }
      banner.hidden = false;
    }
  } catch (e) {
    thinking.textContent = `(error: ${e.message})`;
  } finally {
    btn.disabled = false;
    inputEl.focus();
  }
}

document.getElementById("send").onclick = send;
document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>
</body>
</html>
