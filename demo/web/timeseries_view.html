<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/demo/favicon.png">
  <title>Arikizu Timeseries</title>
  <style>
    :root { --bg:#ffffff; --fg:#0a0a0a; --muted:#666666; --accent:#ff6b1a; --card:#ffffff;
            --border:#e5e5e5; --pass:#2d8a4e; --fail:#b84040;
            --mono: ui-monospace, Menlo, Consolas, monospace;
            --sans: -apple-system, system-ui, Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0a0a0a; --fg:#ffffff; --muted:#999999; --accent:#ff8a3a; --card:#141414; --border:#2a2a2a; color-scheme: dark; }
    }
    *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
    .app-header { padding:14px 24px; border-bottom:1px solid var(--border); background:var(--card); display:flex; gap:12px; align-items:center; }
    .app-header a.home { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
    .app-header a.home:hover strong { color:var(--accent); }
    .app-header img { width:32px; height:32px; object-fit:contain; }
    .app-header strong { font-size:16px; letter-spacing:-0.01em; }
    .app-header .sep { color:var(--muted); margin:0 2px; }
    .app-header .page { font-size:15px; color:var(--muted); }
    main { padding:24px; max-width:1100px; margin:0 auto; }
    .ctl { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:12px 18px;
           display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    input, select, button { font:inherit; border-radius:4px; }
    input { background:var(--bg); color:var(--fg); border:1px solid var(--border); padding:5px 8px; }
    button { background:var(--accent); color:#fff; border:none; padding:6px 14px; cursor:pointer; }
    button.sec { background:var(--card); color:var(--fg); border:1px solid var(--border); }
    .viz { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:16px; margin-top:16px; }
    canvas { display:block; width:100%; height:300px; background:var(--bg); border-radius:4px; }
    .legend { margin-top:8px; font-size:12px; color:var(--muted); font-family:var(--mono); }
    .swatch { display:inline-block; width:10px; height:10px; margin-right:4px; vertical-align:middle; border-radius:2px; }
    .meta { color:var(--muted); margin-top:8px; font-size:12px; font-family:var(--mono); }
    .tag { display:inline-block; padding:2px 8px; border-radius:3px; font-family:var(--mono); font-size:11px;
           background: color-mix(in srgb, var(--pass) 20%, transparent); color: var(--pass); }
    .tag.fail { background: color-mix(in srgb, var(--fail) 20%, transparent); color: var(--fail); }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="/demo/" class="home"><img src="/demo/logo.png" alt=""><strong>Arikizu</strong></a>
    <span class="sep">/</span>
    <span class="page">Timeseries</span>
  </header>
  <main>
    <div class="ctl">
      <strong>Load your sensor data:</strong>
      <input id="file" type="file" accept=".csv,.tsv,.txt,.json,.xlsx,.xls" style="font-size:12px">
      <span style="color:var(--muted);font-size:12px">CSV, TSV, JSON, or Excel. First numeric column is used.</span>
    </div>
    <div class="ctl" style="margin-top:12px">
      <strong>Or generate a sample:</strong>
      <label>points:</label>
      <input id="n" type="number" value="120" style="width:70px">
      <label>period:</label>
      <input id="period" type="number" value="30" style="width:60px">
      <label>amplitude:</label>
      <input id="amp" type="number" value="10" style="width:60px">
      <label>anomaly indices (comma):</label>
      <input id="anoms" type="text" value="42,72,95" style="min-width:140px">
      <button id="gen" class="sec">Generate</button>
    </div>
    <div class="ctl" style="margin-top:12px">
      <strong>Analyze:</strong>
      <button id="forecast">Forecast</button>
      <button id="detect">Detect anomaly</button>
      <span id="src-label" style="color:var(--muted);font-size:12px;margin-left:12px">source: generated sine wave</span>
    </div>

    <div class="viz">
      <canvas id="chart"></canvas>
      <div class="legend">
        <span><span class="swatch" style="background: var(--accent)"></span>series</span>
        <span style="margin-left:16px"><span class="swatch" style="background: #3498db"></span>forecast</span>
        <span style="margin-left:16px"><span class="swatch" style="background: var(--fail)"></span>anomaly</span>
      </div>
      <div class="meta" id="meta"></div>
    </div>
  </main>

<script>
"use strict";

let series = [];
let forecast = [];
let anomalies = [];

function makeSine() {
  const n = parseInt(document.getElementById("n").value, 10);
  const period = parseFloat(document.getElementById("period").value);
  const amp = parseFloat(document.getElementById("amp").value);
  const anoms = document.getElementById("anoms").value.split(",")
    .map(s => parseInt(s.trim(), 10)).filter(x => !isNaN(x));
  const arr = [];
  for (let i = 0; i < n; i++) {
    arr.push(50 + amp * Math.sin(2 * Math.PI * i / period));
  }
  for (const idx of anoms) {
    if (idx >= 0 && idx < n) arr[idx] = 50 + amp * 20 + Math.random() * 50;
  }
  series = arr;
  forecast = []; anomalies = [];
  draw();
}

function draw() {
  const canvas = document.getElementById("chart");
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const all = series.concat(forecast);
  if (!all.length) return;
  const minV = Math.min(...all);
  const maxV = Math.max(...all);
  const pad = (maxV - minV) * 0.1 || 1;
  const low = minV - pad, high = maxV + pad;
  const nTot = series.length + forecast.length;
  const dx = W / Math.max(nTot - 1, 1);
  const yOf = v => H - ((v - low) / (high - low)) * (H - 20) - 10;

  // Grid lines
  ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue("--border") || "#ccc";
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const y = (H / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Series line
  ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue("--accent") || "#ff6b1a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  series.forEach((v, i) => {
    const x = i * dx, y = yOf(v);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Forecast line (dashed)
  if (forecast.length) {
    ctx.strokeStyle = "#3498db";
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    const first = series[series.length - 1];
    if (first !== undefined) ctx.moveTo((series.length - 1) * dx, yOf(first));
    forecast.forEach((v, i) => {
      ctx.lineTo((series.length + i) * dx, yOf(v));
    });
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Anomaly markers
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--fail") || "#b84040";
  for (const a of anomalies) {
    const i = a.index ?? -1;
    if (i < 0 || i >= series.length) continue;
    const x = i * dx, y = yOf(series[i]);
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
  }
}

document.getElementById("gen").onclick = () => {
  document.getElementById("src-label").textContent = "source: generated sine wave";
  makeSine();
};

// --- File upload (CSV / TSV / JSON / XLSX) ---
// Pulls one numeric column out of the uploaded file and sets it as the
// current series. Industrial sensor logs vary a lot in shape; the
// heuristic is: skip header rows that are non-numeric, split lines on
// comma/tab/semicolon, and take the first column whose values parse as
// numbers. For Excel, sheetjs is lazy-loaded from a pinned CDN only
// when the user actually picks an xlsx file.

function parseCSVText(text) {
  // Split lines, then tokens. Supports comma, tab, semicolon.
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  const rows = lines.map(l => l.split(/[,\t;]/));
  if (!rows.length) return [];
  // Pick first column where >=80% of rows parse as finite numbers.
  const nCols = Math.max(...rows.map(r => r.length));
  for (let c = 0; c < nCols; c++) {
    const vals = [], numeric = [];
    for (const r of rows) {
      const raw = (r[c] || "").trim();
      const v = parseFloat(raw);
      if (!isNaN(v) && isFinite(v)) {
        numeric.push(v);
      } else if (raw !== "") {
        vals.push(null);
      }
      vals.push(raw);
    }
    if (numeric.length >= 0.8 * lines.length && numeric.length >= 3) {
      return numeric;
    }
  }
  return [];
}

function parseJSON(text) {
  let obj;
  try { obj = JSON.parse(text); } catch { return []; }
  // Shapes we accept: [n, n, n], {series: [...]}, {data: [...]}, [{value: n},...]
  if (Array.isArray(obj) && obj.length && typeof obj[0] === "number") return obj.filter(x => isFinite(x));
  if (Array.isArray(obj) && obj.length && typeof obj[0] === "object") {
    const keys = Object.keys(obj[0]);
    for (const k of keys) {
      const vals = obj.map(r => parseFloat(r[k])).filter(x => !isNaN(x) && isFinite(x));
      if (vals.length >= 3) return vals;
    }
  }
  if (obj && Array.isArray(obj.series)) return obj.series.filter(x => typeof x === "number" && isFinite(x));
  if (obj && Array.isArray(obj.data))   return obj.data.filter(x => typeof x === "number" && isFinite(x));
  return [];
}

async function parseXLSX(file) {
  // Lazy-load sheetjs on first use. Pinned to an exact cdnjs version
  // so it can't break under us. If the user is offline for the demo
  // and has never loaded the page before, this will fail; CSV export
  // from Excel is the recommended fallback.
  if (!window.XLSX) {
    await new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = res;
      s.onerror = () => rej(new Error("could not load sheetjs; try CSV instead"));
      document.head.appendChild(s);
    });
  }
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, {type: "array"});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  // Dump to AoA, re-use the CSV numeric-column picker
  const aoa = window.XLSX.utils.sheet_to_json(sheet, {header: 1});
  const nCols = Math.max(...aoa.map(r => r.length));
  for (let c = 0; c < nCols; c++) {
    const numeric = [];
    for (const r of aoa) {
      const v = parseFloat(r[c]);
      if (!isNaN(v) && isFinite(v)) numeric.push(v);
    }
    if (numeric.length >= 0.8 * aoa.length && numeric.length >= 3) return numeric;
  }
  return [];
}

document.getElementById("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const label = document.getElementById("src-label");
  label.textContent = `source: loading ${file.name}...`;
  label.style.color = "var(--muted)";
  try {
    let parsed = [];
    const ext = file.name.toLowerCase().split(".").pop();
    if (ext === "xlsx" || ext === "xls") {
      parsed = await parseXLSX(file);
    } else if (ext === "json") {
      parsed = parseJSON(await file.text());
    } else {
      parsed = parseCSVText(await file.text());
    }
    if (!parsed.length) {
      label.textContent = `source: ${file.name} - no numeric column found`;
      label.style.color = "var(--fail)";
      return;
    }
    series = parsed;
    forecast = []; anomalies = [];
    document.getElementById("meta").innerHTML =
      `<span class="tag">LOADED</span> ${parsed.length} points from ${file.name}`;
    label.textContent = `source: ${file.name} (${parsed.length} points)`;
    label.style.color = "var(--pass)";
    draw();
  } catch (err) {
    label.textContent = `source: parse failed - ${err.message}`;
    label.style.color = "var(--fail)";
  }
});

document.getElementById("forecast").onclick = async () => {
  if (!series.length) return;
  const r = await fetch("/api/v1/call/timeseries/forecast", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ payload: { series, horizon: 24 } }),
  });
  const b = await r.json();
  forecast = b.forecast || [];
  document.getElementById("meta").innerHTML =
    `<span class="tag">PASS</span> method: ${b.method}, horizon: ${b.horizon}, forecast points: ${forecast.length}`;
  draw();
};

document.getElementById("detect").onclick = async () => {
  if (!series.length) return;
  const r = await fetch("/api/v1/call/timeseries/detect_anomaly", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ payload: { series, threshold: 3.0 } }),
  });
  const b = await r.json();
  anomalies = b.anomalies || [];
  document.getElementById("meta").innerHTML =
    `<span class="tag">PASS</span> method: ${b.method}, anomalies: ${anomalies.length} (backend: ${b.backend || "fallback"})`;
  draw();
};

// Draw initial
makeSine();
window.addEventListener("resize", draw);
</script>
</body>
</html>
