[project]
name = "pipeline-worker"
version = "0.1.0"
description = "YAML pipeline runtime: load, schedule, execute user pipelines."
requires-python = ">=3.11,<3.13"
dependencies = [
    "arikizu-worker",
    "pyyaml>=6.0",
    "croniter>=1.4",
    "httpx>=0.25",
]

[tool.uv.sources]
arikizu-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline_worker"]
