[project]
name = "agent-worker"
version = "0.0.1"
description = "Arikizu agent worker: custom chatbots with capability routing, policy enforcement, and audit"
requires-python = ">=3.11,<3.14"
dependencies = [
    "arikizu-worker-sdk",
    "httpx>=0.27,<1.0",
]

[project.scripts]
agent-worker = "agent_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arikizu-worker-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["agent_worker"]
