[project]
name = "custom-worker"
version = "0.1.0"
description = "Loads user Python files from custom/ and exposes them as capabilities."
requires-python = ">=3.11,<3.13"
dependencies = [
    "arikizu-worker-sdk",
]

[tool.uv.sources]
arikizu-worker-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_worker"]
