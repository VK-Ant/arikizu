[project]
name = "guard-worker"
version = "0.0.1"
description = "Arikizu guard worker; wraps AntGuard for scan, redact, audit"
requires-python = ">=3.11"
dependencies = [
    "arikizu-worker-sdk",
    # "antguard>=0.1.0",
]

[project.scripts]
guard-worker = "guard_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arikizu-worker-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["guard_worker"]
