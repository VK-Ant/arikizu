[project]
name = "audio-worker"
version = "0.0.1"
description = "Arikizu audio worker; wraps Sonarwise for transcription, VAD, keyword spotting"
requires-python = ">=3.11,<3.14"
dependencies = [
    "arikizu-worker-sdk",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    # "sonarwise>=0.1.0",  # bring in on Weekend 6
]

[project.scripts]
audio-worker = "audio_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arikizu-worker-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["audio_worker"]
