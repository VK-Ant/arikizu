[project]
name = "reasoning-worker"
version = "0.0.1"
description = "Arikizu reasoning worker; local GGUF model, LAN gateway, or demo mode"
requires-python = ">=3.11,<3.14"
dependencies = [
    "arikizu-worker-sdk",
    "httpx>=0.27.0",
    # Local GGUF inference. Pre-built wheels for Linux x86_64, aarch64,
    # macOS Apple Silicon, and macOS Intel on CPython 3.11-3.13. If no
    # wheel exists for the host, the worker falls back to builtin KB
    # answers without crashing.
    "llama-cpp-python>=0.2.90",
]

[project.scripts]
reasoning-worker = "reasoning_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arikizu-worker-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["reasoning_worker"]
