[project]
name = "reasoning-worker"
version = "0.0.1"
description = "Arikizu reasoning worker; local GGUF model, LAN gateway, or demo mode"
requires-python = ">=3.11"
dependencies = [
    "arikizu-worker-sdk",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Add real local-LLM support with:
#   cd workers && uv add llama-cpp-python --package reasoning-worker
# Then set ARIKIZU_REASONING_GGUF to point at a .gguf file on disk.
# Making this optional avoids a long install on hosts without the
# right compiler toolchain for the native extension.
local = ["llama-cpp-python>=0.2.90"]

[project.scripts]
reasoning-worker = "reasoning_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arikizu-worker-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["reasoning_worker"]
