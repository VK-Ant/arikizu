[project]
name = "reasoning-worker"
version = "0.0.1"
description = "Arikizu reasoning worker; local LLM via Ollama (or compatible endpoint)"
requires-python = ">=3.11"
dependencies = [
    "arikizu-worker-sdk",
    "httpx>=0.27.0",
]

[project.scripts]
reasoning-worker = "reasoning_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arikizu-worker-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["reasoning_worker"]
