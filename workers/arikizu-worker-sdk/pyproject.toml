[project]
name = "arikizu-worker-sdk"
version = "0.0.1"
description = "Thin IPC shim for Arikizu Python workers"
requires-python = ">=3.11"
dependencies = [
    "msgpack>=1.0.7",
    "pydantic>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arikizu_worker"]
