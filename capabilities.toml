# Arikizu capability registry.
#
# Each capability declares its backing worker, timeouts, and priority.
# Loaded at startup by `arikizu run` and served at /api/v1/capabilities.

# ---------------------------------------------------------------------------
# test (reference worker; proves IPC path end-to-end)
# ---------------------------------------------------------------------------
[test_echo]
name = "test.echo"
worker = "test"
input = { message = "string" }
output = "object"
timeout_ms = 5000
priority = 0

[test_add]
name = "test.add"
worker = "test"
input = { a = "integer", b = "integer" }
output = "object"
timeout_ms = 5000
priority = 0

[test_slow]
name = "test.slow"
worker = "test"
input = { seconds = "number" }
output = "object"
timeout_ms = 10000
priority = -1

