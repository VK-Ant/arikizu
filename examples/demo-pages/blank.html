<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/demo/favicon.png">
  <title>My Demo</title>
  <style>
    /* ===== Shared Arikizu palette (copy to any new demo page) ===== */
    :root { --bg:#faf9f4; --fg:#1a1a1a; --muted:#6b6b6b; --accent:#c75c2a; --card:#fff;
            --border:#e8e6df; --pass:#2d8a4e; --wait:#c89520; --fail:#b84040;
            --mono: ui-monospace, Menlo, Consolas, monospace;
            --sans: -apple-system, system-ui, Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1a14; --fg:#f0f0ec; --muted:#9b9b96; --accent:#e07a4a;
              --card:#23231c; --border:#2f2f26; color-scheme: dark; }
    }
    *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}

    /* Shared header */
    .app-header{padding:14px 24px;border-bottom:1px solid var(--border);background:var(--card);display:flex;gap:12px;align-items:center}
    .app-header a.home{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
    .app-header a.home:hover strong{color:var(--accent)}
    .app-header img{width:32px;height:32px;object-fit:contain}
    .app-header strong{font-size:16px;letter-spacing:-0.01em}
    .app-header .sep{color:var(--muted);margin:0 2px}
    .app-header .page{font-size:15px;color:var(--muted)}

    /* Content */
    main{padding:24px;max-width:900px;margin:0 auto}
    .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:16px}
    button{font:inherit;background:var(--accent);color:#fff;border:none;border-radius:4px;padding:8px 16px;cursor:pointer}
    pre{background:var(--bg);border:1px solid var(--border);padding:12px;border-radius:4px;overflow-x:auto;font-size:12px}
  </style>
</head>
<body>
  <header class="app-header">
    <a href="/demo/" class="home"><img src="/demo/logo.png" alt=""><strong>Arikizu</strong></a>
    <span class="sep">/</span>
    <span class="page">My Demo</span>
  </header>

  <main>
    <div class="card">
      <h3>Your demo starts here</h3>
      <p>This blank page has the shared Arikizu header and palette already wired up.
         Replace this block with your own UI. Call any Arikizu capability with the
         pattern below.</p>
      <button id="try">Try reasoning.answer</button>
      <pre id="out">(click the button)</pre>
    </div>
  </main>

<script>
"use strict";
const API = "/api/v1";

async function callCap(cap, payload = {}) {
  const r = await fetch(`${API}/call/${cap.replace(".", "/")}`, {
    method: "POST", headers: {"content-type": "application/json"},
    body: JSON.stringify({payload}),
  });
  if (!r.ok) throw new Error(`${cap}: ${r.status}`);
  return r.json();
}

document.getElementById("try").onclick = async () => {
  const out = document.getElementById("out");
  out.textContent = "calling...";
  try {
    const r = await callCap("reasoning.answer", {
      question: "What is the sum of 2 and 2?",
      context: "basic arithmetic",
      max_tokens: 50,
    });
    out.textContent = JSON.stringify(r, null, 2);
  } catch (e) {
    out.textContent = "error: " + e.message;
  }
};
</script>
</body>
</html>
